title       = "ommp"
description = "Oh My Music Player — a terminal music player written in Rust. No MPD, no daemon."

# Custom domain, so there is no repository subpath to prefix. static/CNAME is
# copied through verbatim and is what tells GitHub Pages to serve it here.
base_url = "https://ommp.sqzer.com"

[search]
# One page. A full-text index nobody fetches is just bytes.
enabled = false

[highlight]
# The install commands are styled by hand in the template, so the generated
# syntax stylesheet would go unused.
enabled = false
